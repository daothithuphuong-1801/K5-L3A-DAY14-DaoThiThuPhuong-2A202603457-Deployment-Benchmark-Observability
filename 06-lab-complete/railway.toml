# ============================================================
# Railway — build bằng Dockerfile, healthcheck /health.
# Railway tự cấp biến PORT; CMD trong Dockerfile đã nghe theo ${PORT}.
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong tab Variables của service, KHÔNG ghi ở đây.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
