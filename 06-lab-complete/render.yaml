# ============================================================
# Render Blueprint — web service (Docker) + Redis (Key Value).
# Render tự cấp biến PORT; CMD trong Dockerfile đã nghe theo ${PORT}.
# AGENT_API_KEY dùng sync: false → nhập trên dashboard khi tạo Blueprint, không ghi ở đây.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []   # chỉ cho service trong cùng tài khoản Render truy cập
