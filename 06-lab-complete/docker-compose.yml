# ============================================================
# Agent + Redis — chạy cả stack bằng: docker compose up --build
# Trước đó: cp .env.example .env  rồi đặt AGENT_API_KEY
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false       # không có .env vẫn chạy được
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0   # "redis" = tên service, Docker DNS tự phân giải
    depends_on:
      redis:
        condition: service_healthy      # chờ Redis trả PING rồi mới bật agent
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data                # rate limit / cost vẫn còn khi restart Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
